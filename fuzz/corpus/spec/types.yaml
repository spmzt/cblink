# SPDX-License-Identifier: BSD-2-Clause
#
# A spec that uses every feature of the format.  It is the golden-file
# input for cblink_gen_test and is compiled (WARNS=6) into roundtrip_test.
---
name: types
version: 7
doc: |
  Every attribute type, check, list kind, notification and stream
  direction.  Contains "*/" to prove docs cannot end a C comment.
definitions:
  - name: name-max
    type: const
    value: 32
  - name: neg-limit
    type: const
    value: -100
  - name: color
    type: enum
    doc: An enumeration.
    entries:
      - red
      - name: green
        value: 5
      - blue
  - name: perm
    type: flags
    entries:
      - read
      - write
      - name: exec
        value: 7
attribute-sets:
  - name: types
    doc: Top-level attributes.
    attributes:
      - name: u8
        type: u8
      - name: u16
        type: u16
        checks:
          min: 10
          max: 1000
      - name: u32
        type: u32
        enum: color
      - name: u64
        type: u64
      - name: s8
        type: s8
        checks:
          min: neg-limit
      - name: s16
        type: s16
      - name: s32
        type: s32
        checks:
          min: -5
          max: 5
      - name: s64
        type: s64
      - name: on
        type: bool
      - name: marker
        type: flag
      - name: name
        type: string
        checks:
          min-len: 1
          max-len: name-max
      - name: blob
        type: binary
        checks:
          max-len: 16
      - name: digest
        type: bytes
        checks:
          exact-len: 4
      - name: ratio
        type: float
      - name: perms
        type: u32
        enum: perm
      - name: point
        type: nest
        nested-attributes: point
      - name: points
        type: nest
        nested-attributes: point
        multi-attr: true
        checks:
          max-count: 8
      - name: names
        type: text
        multi-attr: true
        checks:
          min-count: 1
          max-count: 4
          max-len: 8
      - name: nums
        type: s32
        multi-attr: true
      - name: tree
        type: nest
        nested-attributes: node
      - name: value
        value: 100
        type: u16
        doc: An explicit id.
      - name: after
        type: u8
        doc: Numbered after the explicit id (101).
  - name: point
    attributes:
      - name: x
        type: s64
        required: true
      - name: y
        type: s64
  - name: node
    doc: A recursive structure.
    attributes:
      - name: label
        type: text
      - name: kids
        type: nest
        nested-attributes: node
        multi-attr: true
operations:
  - name: echo
    doc: Echo every attribute back.
    attribute-set: types
    do:
      request:
        attributes:
          - u8
          - u16
          - u32
          - u64
          - s8
          - s16
          - s32
          - s64
          - on
          - marker
          - name
          - blob
          - digest
          - ratio
          - perms
          - point
          - points
          - names
          - nums
          - tree
          - value
          - after
        required:
          - name
      reply:
        attributes:
          - u8
          - u16
          - u32
          - u64
          - s8
          - s16
          - s32
          - s64
          - on
          - marker
          - name
          - blob
          - digest
          - ratio
          - perms
          - point
          - points
          - names
          - nums
          - tree
          - value
          - after
  - name: poke
    doc: A do with no request and no reply.
    attribute-set: types
    auth: true
    do:
      reply:
        attributes:
          - u8
  - name: list
    value: 10
    attribute-set: types
    do:
      request:
        attributes:
          - u32
        required:
          - u32
    dump:
      request:
        attributes:
          - u16
      reply:
        attributes:
          - u16
          - name
  - name: changed
    attribute-set: types
    mcgrp: events
    event:
      attributes:
        - name
        - u32
  - name: chat
    attribute-set: types
    do:
      request:
        attributes:
          - name
      reply:
        attributes:
          - u8
  - name: feed
    attribute-set: types
    do:
      request:
        attributes:
          - u16
  - name: upload
    attribute-set: types
    do:
      request:
        attributes:
          - name
mcast-groups:
  - name: events
  - name: audit
    auth: true
streams:
  - name: chat
    open: chat
    direction: bidirectional
    payload: point
    initial-credit: 4096
  - name: feed
    open: feed
    direction: server-to-client
    payload: node
  - name: upload
    open: upload
    direction: client-to-server
    payload-up: point
