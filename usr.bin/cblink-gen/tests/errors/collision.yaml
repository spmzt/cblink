name: t
version: 1
attribute-sets:
  - name: get-req
    attributes:
      - name: a
        type: u8
  - name: t
    attributes:
      - name: key
        type: u8
operations:
  - name: get
    attribute-set: get-req
    do:
      request:
        attributes:
          - a
  - name: put-key
    attribute-set: t
    do:
      request:
        attributes:
          - key
